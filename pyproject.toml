[project]
name = "invoice-to-pay"
version = "0.1.0"
description = "Invoice-to-Pay agent for Meridian Supply"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies come from the Stack sheet and are added by the task that first needs them.
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.115",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt[crypto]>=2.8",
    "python-magic>=0.4.27",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "import-linter>=2",
    "mypy",
    "pytest>=8,<9",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_to_pay"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated from the workbook; never hand-edited or reformatted.
extend-exclude = ["CLAUDE.md", "tasks", "docs", "spec", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# C-02: strict on domain, contracts, control and application layers.
[[tool.mypy.overrides]]
module = [
    "invoice_to_pay.domain.*",
    "invoice_to_pay.contracts.*",
    "invoice_to_pay.control.*",
    "invoice_to_pay.application.*",
    "invoice_to_pay.config.*",
]
strict = true

# Untyped third-party packages used only inside their adapter or service.
[[tool.mypy.overrides]]
module = ["aioboto3", "botocore.*", "magic"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

# Framework Rules sheet, enforced by `lint-imports` (D-05).
# Each contract lists the modules a framework may NOT be imported from.
# Add a framework's contract in the task that adds the framework to the Stack.
[tool.importlinter]
root_package = "invoice_to_pay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain imports no framework (C-01)"
type = "forbidden"
source_modules = ["invoice_to_pay.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic_settings"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "FastAPI only in api/ and main.py"
type = "forbidden"
source_modules = [
    "invoice_to_pay.config",
    "invoice_to_pay.contracts",
    "invoice_to_pay.control",
    "invoice_to_pay.domain",
    "invoice_to_pay.application",
]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers: api -> application -> control -> domain -> contracts"
type = "layers"
layers = [
    "invoice_to_pay.main",
    "invoice_to_pay.api",
    "invoice_to_pay.application",
    "invoice_to_pay.control",
    "invoice_to_pay.domain",
    "invoice_to_pay.contracts",
]

[[tool.importlinter.contracts]]
name = "PyJWT only in api/deps.py"
type = "forbidden"
source_modules = [
    "invoice_to_pay.main",
    "invoice_to_pay.api.errors",
    "invoice_to_pay.config",
    "invoice_to_pay.contracts",
    "invoice_to_pay.control",
    "invoice_to_pay.domain",
    "invoice_to_pay.application",
]
forbidden_modules = ["jwt"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "OpenTelemetry only in observability/ and main.py"
type = "forbidden"
source_modules = [
    "invoice_to_pay.api",
    "invoice_to_pay.application",
    "invoice_to_pay.config",
    "invoice_to_pay.contracts",
    "invoice_to_pay.control",
    "invoice_to_pay.domain",
]
forbidden_modules = ["opentelemetry"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application, domain and contracts import no persistence or storage SDK"
type = "forbidden"
source_modules = [
    "invoice_to_pay.application",
    "invoice_to_pay.files",
    "invoice_to_pay.domain",
    "invoice_to_pay.contracts",
]
forbidden_modules = ["sqlalchemy", "aioboto3", "botocore"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "aioboto3 only in adapters/s3_storage.py"
type = "forbidden"
source_modules = [
    "invoice_to_pay.main",
    "invoice_to_pay.api",
    "invoice_to_pay.config",
    "invoice_to_pay.control",
    "invoice_to_pay.observability",
    "invoice_to_pay.adapters.sql_file_records",
]
forbidden_modules = ["aioboto3", "botocore"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Job queue (arq, redis) only in workers/ and adapters/arq_events.py"
type = "forbidden"
source_modules = [
    "invoice_to_pay.api",
    "invoice_to_pay.application",
    "invoice_to_pay.config",
    "invoice_to_pay.contracts",
    "invoice_to_pay.control",
    "invoice_to_pay.domain",
    "invoice_to_pay.files",
    "invoice_to_pay.observability",
    "invoice_to_pay.adapters.s3_storage",
    "invoice_to_pay.adapters.sql_file_records",
    "invoice_to_pay.adapters.sql_runs",
]
forbidden_modules = ["arq", "redis"]
allow_indirect_imports = true
