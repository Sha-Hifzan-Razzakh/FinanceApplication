# Local services (Local Services sheet). Processes (api, worker, erp-stub, erp-mcp) run with uv; see Makefile.
# Every credential below is a local-only development placeholder.
name: invoice-to-pay

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itp
      POSTGRES_PASSWORD: itp-local-only
      POSTGRES_DB: itp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itp -d itp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: itp-local
      MINIO_ROOT_PASSWORD: itp-local-only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  vault:
    image: hashicorp/vault
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: itp-local-only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  otel-collector:
    image: otel/opentelemetry-collector
    ports: ["4317:4317"]

volumes:
  pgdata:
  miniodata:
